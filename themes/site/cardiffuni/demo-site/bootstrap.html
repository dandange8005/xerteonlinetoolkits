<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap - Cardiff University Theme</title>
    <meta name="description" content="Cardiff-branded overrides for Bootstrap 2.3.0 components.">

    <!-- Theme CSS -->
    <link rel="stylesheet" href="../cardiffuni.css">

    <!-- Demo Site CSS -->
    <link rel="stylesheet" href="assets/css/prism.css">
    <link rel="stylesheet" href="assets/css/demo-site.css">
</head>
<body>

    <!-- MAIN CONTENT AREA -->
    <main class="demo-main">
        <!-- Content Area -->
        <div class="demo-content">

            <!-- SECTION 6: BOOTSTRAP OVERRIDES -->
            <section id="bootstrap" class="demo-section">
                <h2 class="demo-section__title">Bootstrap Components</h2>
                <p class="demo-section__description">Cardiff-branded overrides for Bootstrap components.</p>

                <!-- Tabs -->
                <h3>Tabs</h3>
                <div class="element-demo">
                    <ul class="nav nav-tabs">
                        <li class="active"><a href="#tab1">Tab 1</a></li>
                        <li><a href="#tab2">Tab 2</a></li>
                        <li><a href="#tab3">Tab 3</a></li>
                    </ul>
                    <div class="tab-content">
                        <div class="tab-pane active" id="tab1">
                            <p>Content for Tab 1. Navigation tabs use Cardiff brand colors with hover and active states.</p>
                        </div>
                    </div>
                </div>

                <!-- Pills -->
                <h3>Pills</h3>
                <div class="element-demo">
                    <ul class="nav nav-pills">
                        <li class="active"><a href="#pill1">Active</a></li>
                        <li><a href="#pill2">Pill 2</a></li>
                        <li><a href="#pill3">Pill 3</a></li>
                    </ul>
                </div>
            </section>


        </div><!-- .demo-content -->
    </main>

    <!-- Scripts -->
    <script src="assets/js/vendor/prism.js" defer></script>
    <script src="assets/js/vendor/clipboard.min.js" defer></script>
    <script src="assets/js/demo-site.js" type="module"></script>

</body>
</html>
